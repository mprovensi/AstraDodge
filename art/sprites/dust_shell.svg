  <circle cx="128" cy="128" r="104" fill="none" stroke="#a4b4d1" stroke-width="4"
          stroke-dasharray="110 53" stroke-dashoffset="-4" stroke-linecap="round"/>
  <g fill="#d6e0f2">
    <circle cx="128" cy="24" r="5"/><circle cx="232" cy="128" r="5"/>
    <circle cx="128" cy="232" r="5"/><circle cx="24" cy="128" r="5"/>
  </g>
