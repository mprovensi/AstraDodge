<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- COLOSSO DE GELO (chefe do Setor 5): bloco de gelo gigante e facetado, vista de cima.
       O núcleo (ponto fraco, centro 128,128) e as placas que orbitam são desenhados pelo código.
       Raio útil ~120 (a colisão do corpo é um círculo um pouco menor). -->
  <defs>
    <radialGradient id="body" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#e9f8ff"/>
      <stop offset="0.5" stop-color="#7fb8e0"/>
      <stop offset="1" stop-color="#1d3d66"/>
    </radialGradient>
  </defs>
  <path d="M128 6 L186 20 L230 62 L250 122 L238 182 L198 230 L134 250 L72 238 L24 196 L6 134 L20 72 L66 22 Z"
        fill="url(#body)" stroke="#f2fbff" stroke-width="6" stroke-linejoin="round"/>
  <!-- Facetas que convergem para o núcleo -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3">
    <path d="M128 6 L128 84 M230 62 L166 102 M238 182 L168 152 M134 250 L130 172 M24 196 L90 154 M20 72 L90 102"/>
  </g>
  <!-- Rachaduras escuras com brilho frio -->
  <g fill="none" stroke="#123058" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 120 L70 136 L60 160"/>
    <path d="M196 88 L210 110 L200 128"/>
    <path d="M150 210 L170 196"/>
  </g>
  <!-- Encaixe do núcleo -->
  <circle cx="128" cy="128" r="40" fill="#0b1e38" stroke="#cdeeff" stroke-width="5"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#9ad3f0" stroke-opacity="0.6" stroke-width="3"/>
</svg>
