<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Rocha-Mãe (chefe do Setor 1): rocha gigante avermelhada com rachaduras incandescentes.
       Os 4 núcleos (pontos fracos) são desenhados pelo código na borda. Raio útil ~122. -->
